                  - name: file
                    type: ts
                    code:
                      - "// -Path: \"cli/src/command/types/file.ts\"\r"
                      - "\r"
                      - "/**\r"
                      - " * @description File node structure for project generation\r"
                      - " */\r"
                      - "export interface FileNode {\r"
                      - "    /**\r"
                      - "     * @description File or folder type (e.g., 'folder', 'ts', 'tsx', 'png')\r"
                      - "     * @example 'folder', 'ts', 'tsx', 'png'\r"
                      - "     */\r"
                      - "    type: string;\r"
