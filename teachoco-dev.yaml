$schema: >-
  https://raw.githubusercontent.com/TeaChocoOfficial/cli/main/structure.schema.json
workspaces:
  - name: my-workspace
    run: npm start
    pack: {}
    src:
      - name: public
        type: folder
        children: []
      - name: src
        type: folder
        children:
          - name: class
            type: folder
            children:
              - name: ary
                type: ts
                code:
                  - "//-Path: \"cli/src/class/ary.ts\"\r"
                  - "/**\r"
                  - " * Utility class for array operations\r"
                  - " */\r"
                  - "export abstract class Ary {\r"
                  - "    /**\r"
                  - "     * Check if value is an array\r"
                  - "     * @param ary - Value to check\r"
                  - "     * @returns True if value is an array\r"
                  - "     */\r"
                  - "    static is(ary: unknown): ary is any[] {\r"
                  - "        return Array.isArray(ary);\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Get first element of array\r"
                  - "     * @param ary - Array to get first element from\r"
                  - "     * @returns First element\r"
                  - "     */\r"
                  - "    static first<Value>(ary: Value[]): Value {\r"
                  - "        return ary[0];\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Get last element of array\r"
                  - "     * @param ary - Array to get last element from\r"
                  - "     * @returns Last element\r"
                  - "     */\r"
                  - "    static last<Value>(ary: Value[]): Value {\r"
                  - "        return ary[ary.length - 1];\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Get random element from array\r"
                  - "     * @param array - Array to get random element from\r"
                  - "     * @returns Random element\r"
                  - "     */\r"
                  - "    static random<Value>(array: Value[]): Value {\r"
                  - "        return array.length > 0\r"
                  - "            ? array[Math.floor(Math.random() * array.length)]\r"
                  - "            : array[0];\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Shuffle array randomly\r"
                  - "     * @param array - Array to shuffle\r"
                  - "     * @returns Shuffled array\r"
                  - "     */\r"
                  - "    static shuffle<Value>(array: Value[]): Value[] {\r"
                  - "        if (array?.length > 1) array.sort(() => Math.random() - 0.5);\r"
                  - "        return array;\r"
                  - "    }\r"
                  - "}\r"
                  - ''
              - name: num
                type: ts
                code:
                  - "//-Path: \"cli/src/class/num.ts\"\r"
                  - "/**\r"
                  - " * Utility class for number operations\r"
                  - " */\r"
                  - "export abstract class Num {\r"
                  - "    /**\r"
                  - "     * Format number with thousand separators\r"
                  - "     * @param number - Number to format\r"
                  - "     * @returns Formatted number string\r"
                  - "     */\r"
                  - "    static format(number: number): string {\r"
                  - "        return number.toString().replace(/(\\d)(?=(\\d{3})+(?!\\d))/g, \"$1,\");\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Format number with suffix (k, m, g, t, p, e, z, y)\r"
                  - "     * @param num - Number to format\r"
                  - "     * @param decimal - Number of decimal places\r"
                  - "     * @returns Formatted number with suffix\r"
                  - "     */\r"
                  - "    static count(num: number, decimal: number = 2): string {\r"
                  - "        const suffixes = [\"\", \"k\", \"m\", \"g\", \"t\", \"p\", \"e\", \"z\", \"y\"];\r"
                  - "        let i = 0;\r"
                  - "\r"
                  - "        while (num >= 1000 && i < suffixes.length - 1) {\r"
                  - "            num /= 1000;\r"
                  - "            i++;\r"
                  - "        }\r"
                  - "        const formattedNum = this.rounding(num, decimal).toString();\r"
                  - "\r"
                  - "        if (!formattedNum.includes(\".\")) {\r"
                  - "            return `${formattedNum}${suffixes[i]}`;\r"
                  - "        }\r"
                  - "\r"
                  - "        const [integerPart, decimalPart] = formattedNum.split(\".\");\r"
                  - "        if (!decimalPart.replace(/0/g, \"\")) {\r"
                  - "            return `${integerPart}${suffixes[i]}`;\r"
                  - "        }\r"
                  - "\r"
                  - "        return `${formattedNum}${suffixes[i]}`;\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Round number to specified decimal places\r"
                  - "     * @param num - Number to round\r"
                  - "     * @param decimal - Number of decimal places\r"
                  - "     * @returns Rounded number\r"
                  - "     */\r"
                  - "    static rounding(num: number, decimal: number = 2): number {\r"
                  - "        const [integerPart, decimalPart] = String(num).split(\".\");\r"
                  - "        if (decimalPart) {\r"
                  - "            const fixedNumber = parseFloat(\r"
                  - "                integerPart + \".\" + decimalPart.substring(0, decimal),\r"
                  - "            );\r"
                  - "            return fixedNumber;\r"
                  - "        } else if (integerPart) {\r"
                  - "            return parseFloat(integerPart);\r"
                  - "        } else {\r"
                  - "            return num;\r"
                  - "        }\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Add leading zeros to number\r"
                  - "     * @param num - Number to format\r"
                  - "     * @param index - Number of digits\r"
                  - "     * @returns Number string with leading zeros\r"
                  - "     */\r"
                  - "    static zeroNumber(num: number, index: number = 1): string {\r"
                  - "        return (num < 10 ** index ? \"0\" + num : num).toString();\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Round number to 2 decimal places\r"
                  - "     * @param num - Number to fix\r"
                  - "     * @returns Number rounded to 2 decimal places\r"
                  - "     */\r"
                  - "    static fixed(num: number): number {\r"
                  - "        return Math.round(num * 100) / 100;\r"
                  - "    }\r"
                  - "}\r"
                  - ''
              - name: obj
                type: ts
                code:
                  - "//-Path: \"cli/src/class/obj.ts\"\r"
                  - "/**\r"
                  - " * Utility class for object operations\r"
                  - " */\r"
                  - "export abstract class Obj {\r"
                  - "    /**\r"
                  - "     * Get object keys\r"
                  - "     * @param value - Object to get keys from\r"
                  - "     * @returns Array of keys\r"
                  - "     */\r"
                  - "    static keys<Value extends object>(value: Value): (keyof Value)[] {\r"
                  - "        return Object.keys(value) as (keyof Value)[];\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Get object values\r"
                  - "     * @param object - Object to get values from\r"
                  - "     * @returns Array of values\r"
                  - "     */\r"
                  - "    static values<Value extends object>(object: Value): Value[keyof Value][] {\r"
                  - "        return Object.values(object) as Value[keyof Value][];\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Check if value is an object\r"
                  - "     * @param obj - Value to check\r"
                  - "     * @returns True if value is an object\r"
                  - "     */\r"
                  - "    static isObject(obj: any): obj is object {\r"
                  - "        return obj !== null && typeof obj === \"object\" && !Array.isArray(obj);\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Reduce object to a single value\r"
                  - "     * @param obj - Object to reduce\r"
                  - "     * @param callbackfn - Callback function for reduction\r"
                  - "     * @param initialValue - Initial value for reduction\r"
                  - "     * @returns Reduced value\r"
                  - "     */\r"
                  - "    static reduce<Object extends object = object, InitialValue = Object>(\r"
                  - "        obj: Object,\r"
                  - "        callbackfn: (\r"
                  - "            previousValue: InitialValue,\r"
                  - "            currentKey: keyof Object,\r"
                  - "            currentValue: Object[keyof Object],\r"
                  - "            currentIndex: number,\r"
                  - "            array: (keyof Object)[],\r"
                  - "        ) => InitialValue,\r"
                  - "        initialValue: InitialValue,\r"
                  - "    ) {\r"
                  - "        return this.keys(obj).reduce(\r"
                  - "            (previousValue, currentKey, currentIndex, array) => {\r"
                  - "                const currentValue = obj[currentKey];\r"
                  - "                return callbackfn(\r"
                  - "                    previousValue,\r"
                  - "                    currentKey,\r"
                  - "                    currentValue,\r"
                  - "                    currentIndex,\r"
                  - "                    array,\r"
                  - "                );\r"
                  - "            },\r"
                  - "            initialValue,\r"
                  - "        );\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Amend object by transforming values\r"
                  - "     * @param obj - Object to amend\r"
                  - "     * @param callbackfn - Callback function to transform values\r"
                  - "     * @returns Amended object\r"
                  - "     */\r"
                  - "    static amend<\r"
                  - "        Object extends object = object,\r"
                  - "        NewObject extends object = Object,\r"
                  - "    >(\r"
                  - "        obj: Object,\r"
                  - "        callbackfn: (\r"
                  - "            currentKey: keyof Object,\r"
                  - "            currentValue: Object[keyof Object],\r"
                  - "            currentIndex: number,\r"
                  - "            array: (keyof Object)[],\r"
                  - "        ) => NewObject[keyof NewObject],\r"
                  - "    ): NewObject {\r"
                  - "        return this.reduce<Object, NewObject>(\r"
                  - "            obj,\r"
                  - "            (previousValue, currentKey, currentValue, currentIndex, array) => {\r"
                  - "                const newValue = callbackfn(\r"
                  - "                    currentKey,\r"
                  - "                    currentValue,\r"
                  - "                    currentIndex,\r"
                  - "                    array,\r"
                  - "                );\r"
                  - "                (previousValue as unknown as Object)[currentKey] =\r"
                  - "                    newValue as unknown as Object[keyof Object];\r"
                  - "                return previousValue;\r"
                  - "            },\r"
                  - "            obj as unknown as NewObject,\r"
                  - "        );\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Map object values to new array\r"
                  - "     * @param obj - Object to map\r"
                  - "     * @param callbackfn - Callback function to transform values\r"
                  - "     * @returns Mapped array\r"
                  - "     */\r"
                  - "    static map<Value, Object extends object = object>(\r"
                  - "        obj: Object,\r"
                  - "        callbackfn: (\r"
                  - "            value: Object[keyof Object],\r"
                  - "            key: keyof Object,\r"
                  - "            index: number,\r"
                  - "            array: (keyof Object)[],\r"
                  - "        ) => Value,\r"
                  - "    ): Value[] {\r"
                  - "        return this.keys(obj).map((key, index, array) => {\r"
                  - "            const value = obj[key];\r"
                  - "            return callbackfn(value, key, index, array);\r"
                  - "        }, []);\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Check if value is a plain object\r"
                  - "     * @param obj - Value to check\r"
                  - "     * @returns True if value is a plain object\r"
                  - "     */\r"
                  - "    static isPlainObject(obj: any): obj is object {\r"
                  - "        if (!this.isObject(obj)) return false;\r"
                  - "        const proto = Object.getPrototypeOf(obj);\r"
                  - "        return proto === Object.prototype || proto === null;\r"
                  - "    }\r"
                  - "\r"
                  - "    /**\r"
                  - "     * Check if value is a class instance\r"
                  - "     * @param obj - Value to check\r"
                  - "     * @returns True if value is a class instance\r"
                  - "     */\r"
                  - "    static isClassInstance(obj: any): obj is object {\r"
                  - "        if (!this.isObject(obj)) return false;\r"
                  - "        const proto = Object.getPrototypeOf(obj);\r"
                  - "        return (\r"
                  - "            proto !== Object.prototype &&\r"
                  - "            proto !== null &&\r"
                  - "            proto.constructor !== Object\r"
                  - "        );\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Get object entries as key-value pairs\r"
                  - "     * @param value - Object to get entries from\r"
                  - "     * @returns Array of key-value pairs\r"
                  - "     */\r"
                  - "    static entries<Value extends object>(\r"
                  - "        value: Value,\r"
                  - "    ): { [K in keyof Value]: [K, Value[K]] }[keyof Value][] {\r"
                  - "        return Object.entries(value) as {\r"
                  - "            [K in keyof Value]: [K, Value[K]];\r"
                  - "        }[keyof Value][];\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Omit specified keys from object\r"
                  - "     * @param value - Object to omit keys from\r"
                  - "     * @param keys - Keys to omit\r"
                  - "     * @returns Object with omitted keys\r"
                  - "     */\r"
                  - "    static omit<Value extends object, Key extends keyof Value>(\r"
                  - "        value: Value,\r"
                  - "        ...keys: Key[]\r"
                  - "    ): Omit<Value, Key> {\r"
                  - "        const result = { ...value };\r"
                  - "        keys.forEach((key) => {\r"
                  - "            delete result[key];\r"
                  - "        });\r"
                  - "        return result as Omit<Value, Key>;\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Deep merge multiple objects\r"
                  - "     * @param objects - Objects to merge\r"
                  - "     * @returns Merged object\r"
                  - "     */\r"
                  - "    static mix<MixObject extends object>(...objects: object[]): MixObject {\r"
                  - "        return objects.reduce(\r"
                  - "            (result: Record<string, any>, current: Record<string, any>) => {\r"
                  - "                if (!this.isPlainObject(current)) return result;\r"
                  - "                this.keys(current).forEach((key: string) => {\r"
                  - "                    const resultValue = result[key];\r"
                  - "                    const currentValue = current[key];\r"
                  - "                    if (\r"
                  - "                        this.isPlainObject(resultValue) &&\r"
                  - "                        this.isPlainObject(currentValue)\r"
                  - "                    ) {\r"
                  - "                        result[key] = this.mix(resultValue, currentValue);\r"
                  - "                    } else if (currentValue !== undefined) {\r"
                  - "                        result[key] = currentValue;\r"
                  - "                    }\r"
                  - "                });\r"
                  - "                return result;\r"
                  - "            },\r"
                  - "            {} as MixObject,\r"
                  - "        ) as MixObject;\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Check if object has own property\r"
                  - "     * @param obj - Object to check\r"
                  - "     * @param key - Key to check\r"
                  - "     * @returns True if object has own property\r"
                  - "     */\r"
                  - "    static hasOwn<Object extends object>(\r"
                  - "        obj: Object,\r"
                  - "        key: keyof Object,\r"
                  - "    ): key is keyof Object {\r"
                  - "        return Object.prototype.hasOwnProperty.call(obj, key);\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Check if all object values pass test\r"
                  - "     * @param object - Object to test\r"
                  - "     * @param method - Test function\r"
                  - "     * @returns True if all values pass test\r"
                  - "     */\r"
                  - "    static every<Object extends object>(\r"
                  - "        object: Object,\r"
                  - "        method: (\r"
                  - "            value: Object[keyof Object],\r"
                  - "            key: keyof Object,\r"
                  - "            index: number,\r"
                  - "            array: (keyof Object)[],\r"
                  - "        ) => boolean,\r"
                  - "    ): boolean {\r"
                  - "        return this.keys(object).every((key, index, array) =>\r"
                  - "            method(object[key], key, index, array),\r"
                  - "        );\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Filter object by values\r"
                  - "     * @param object - Object to filter\r"
                  - "     * @param method - Filter function\r"
                  - "     * @returns Filtered object\r"
                  - "     */\r"
                  - "    static filter<Object extends object, NewObject extends object = Object>(\r"
                  - "        object: Object,\r"
                  - "        method: (\r"
                  - "            value: Object[keyof Object],\r"
                  - "            key: keyof Object,\r"
                  - "            index: number,\r"
                  - "            array: (keyof Object)[],\r"
                  - "        ) => boolean,\r"
                  - "    ): NewObject {\r"
                  - "        return this.keys(object)\r"
                  - "            .filter((key, index, array) =>\r"
                  - "                method(object[key], key, index, array),\r"
                  - "            )\r"
                  - "            .reduce((result, key) => {\r"
                  - "                (result as Object)[key] = object[key];\r"
                  - "                return result;\r"
                  - "            }, {}) as NewObject;\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Get number of keys in object\r"
                  - "     * @param object - Object to count\r"
                  - "     * @returns Number of keys\r"
                  - "     */\r"
                  - "    static leng(object: object) {\r"
                  - "        return this.keys(object).length;\r"
                  - "    }\r"
                  - "}\r"
                  - ''
              - name: ReactHook
                type: tsx
                code:
                  - "//-Path: \"cli/src/class/ReactHook.tsx\"\r"
                  - "import { useEffect, DependencyList, useState } from \"react\";\r"
                  - "\r"
                  - "export class ReactHook {\r"
                  - "    static EventListener<K extends keyof DocumentEventMap>(\r"
                  - "        type: K,\r"
                  - "        listener: (this: Document, event: DocumentEventMap[K]) => any,\r"
                  - "        options?: boolean | AddEventListenerOptions,\r"
                  - "        deps: DependencyList = [],\r"
                  - "    ) {\r"
                  - "        useEffect(() => {\r"
                  - "            document.addEventListener(type, listener, options);\r"
                  - "            return () => document.removeEventListener(type, listener, options);\r"
                  - "        }, deps);\r"
                  - "    }\r"
                  - "    static MousePositionTracker(deps: DependencyList = []) {\r"
                  - "        const [mousePosition, setMousePosition] = useState<\r"
                  - "            { x?: number; y?: number } | undefined\r"
                  - "        >();\r"
                  - "\r"
                  - "        useEffect(() => {\r"
                  - "            const updateMousePosition = (event: MouseEvent) =>\r"
                  - "                setMousePosition({ x: event.clientX, y: event.clientY });\r"
                  - "\r"
                  - "            window.addEventListener(\"mousemove\", updateMousePosition);\r"
                  - "            return () =>\r"
                  - "                window.removeEventListener(\"mousemove\", updateMousePosition);\r"
                  - "        }, deps);\r"
                  - "\r"
                  - "        return mousePosition;\r"
                  - "    }\r"
                  - "    useProEffect(\r"
                  - "        effect: () => Promise<void>,\r"
                  - "        deps: React.DependencyList = [],\r"
                  - "        callback: () => void = () => {},\r"
                  - "    ) {\r"
                  - "        useEffect(() => {\r"
                  - "            effect();\r"
                  - "            return callback();\r"
                  - "        }, deps);\r"
                  - "    }\r"
                  - "}\r"
                  - ''
              - name: storage
                type: ts
                code:
                  - "//-Path: \"cli/src/class/storage.ts\"\r"
                  - "\r"
                  - "/**\r"
                  - " * Get data from localStorage\r"
                  - " * @param key - Storage key\r"
                  - " * @returns Stored data or undefined\r"
                  - " */\r"
                  - "export function getStorage<Data = string>(key: string): Data | undefined {\r"
                  - "    if (localStorage?.getItem !== undefined) {\r"
                  - "        const data = localStorage.getItem(key) as Data;\r"
                  - "        if (data === null) {\r"
                  - "            return undefined;\r"
                  - "        } else {\r"
                  - "            try {\r"
                  - "                return JSON.parse(localStorage.getItem(key) as string) as Data;\r"
                  - "            } catch (_) {\r"
                  - "                return localStorage.getItem(key) as Data;\r"
                  - "            }\r"
                  - "        }\r"
                  - "    }\r"
                  - "}\r"
                  - "\r"
                  - "/**\r"
                  - " * Set data to localStorage\r"
                  - " * @param key - Storage key\r"
                  - " * @param value - Value to store\r"
                  - " */\r"
                  - "export function setStorage<Data = string | undefined>(\r"
                  - "    key: string,\r"
                  - "    value: Data,\r"
                  - ") {\r"
                  - "    if (localStorage?.setItem !== undefined) {\r"
                  - "        localStorage.setItem(\r"
                  - "            key,\r"
                  - "            typeof value === \"string\" ? value : JSON.stringify(value),\r"
                  - "        );\r"
                  - "    }\r"
                  - "}\r"
                  - "\r"
                  - "/**\r"
                  - " * Get boolean setting from localStorage\r"
                  - " * @param key - Setting key\r"
                  - " * @param defaultValue - Default value if not set\r"
                  - " * @returns Setting value or default\r"
                  - " */\r"
                  - "export function getSetting<Data = boolean | undefined>(\r"
                  - "    key: string,\r"
                  - "    defaultValue: Data = undefined as Data,\r"
                  - ") {\r"
                  - "    if (localStorage?.getItem !== undefined) {\r"
                  - "        const data = localStorage.getItem(`setting ${key}`);\r"
                  - "        if (data === \"true\") {\r"
                  - "            return true as Data;\r"
                  - "        } else if (data === \"false\") {\r"
                  - "            return false as Data;\r"
                  - "        } else if (data === null) {\r"
                  - "            if (defaultValue !== undefined) {\r"
                  - "                setSetting(key, defaultValue);\r"
                  - "            }\r"
                  - "            return defaultValue;\r"
                  - "        } else {\r"
                  - "            return data as Data;\r"
                  - "        }\r"
                  - "    }\r"
                  - "}\r"
                  - "\r"
                  - "/**\r"
                  - " * Set boolean setting to localStorage\r"
                  - " * @param key - Setting key\r"
                  - " * @param value - Value to store\r"
                  - " */\r"
                  - "export function setSetting<Data = boolean | undefined>(\r"
                  - "    key: string,\r"
                  - "    value: Data,\r"
                  - ") {\r"
                  - "    if (localStorage?.setItem !== undefined) {\r"
                  - "        localStorage.setItem(\r"
                  - "            `setting ${key}`,\r"
                  - "            typeof value === \"boolean\"\r"
                  - "                ? value === true\r"
                  - "                    ? \"true\"\r"
                  - "                    : \"false\"\r"
                  - "                : typeof value === \"string\"\r"
                  - "                ? value\r"
                  - "                : JSON.stringify(value),\r"
                  - "        );\r"
                  - "    }\r"
                  - "}\r"
                  - ''
              - name: str
                type: ts
                code:
                  - "//-Path: \"cli/src/class/str.ts\"\r"
                  - "\r"
                  - "/**\r"
                  - " * Utility class for string operations\r"
                  - " */\r"
                  - "export abstract class Str {\r"
                  - "    /**\r"
                  - "     * Truncate text to maximum length\r"
                  - "     * @param text - Text to truncate\r"
                  - "     * @param max - Maximum length\r"
                  - "     * @returns Truncated text with ellipsis or original text\r"
                  - "     */\r"
                  - "    static max(text?: string | number, max: number = 20): string | undefined {\r"
                  - "        if (typeof text == \"string\") {\r"
                  - "            const Text = text.toString();\r"
                  - "            return Text.length > max ? Text.substring(0, max) + \"...\" : Text;\r"
                  - "        }\r"
                  - "    }\r"
                  - "}\r"
                  - ''
              - name: time
                type: ts
                code:
                  - "//-Path: \"cli/src/class/time.ts\"\r"
                  - "import dayjs from \"dayjs\";\r"
                  - "\r"
                  - "/**\r"
                  - " * Utility class for time operations\r"
                  - " */\r"
                  - "export abstract class Time {\r"
                  - "    /**\r"
                  - "     * Get time difference as human-readable string\r"
                  - "     * @param timestamp - Timestamp to compare (defaults to now)\r"
                  - "     * @returns Time difference string\r"
                  - "     */\r"
                  - "    static left(timestamp?: number): string {\r"
                  - "        const now = new Date().getTime();\r"
                  - "        const timeDifference = now - (timestamp ?? new Date().getTime());\r"
                  - "\r"
                  - "        const seconds = Math.floor(timeDifference / 1000);\r"
                  - "        const minutes = Math.floor(seconds / 60);\r"
                  - "        const hours = Math.floor(minutes / 60);\r"
                  - "        const days = Math.floor(hours / 24);\r"
                  - "\r"
                  - "        if (days > 30) {\r"
                  - "            return \"morethen\";\r"
                  - "        } else if (days > 0) {\r"
                  - "            return `${days} days`;\r"
                  - "        } else if (hours > 0) {\r"
                  - "            return `${hours} hours`;\r"
                  - "        } else if (minutes > 0) {\r"
                  - "            return `${minutes} minutes`;\r"
                  - "        } else if (seconds > 0) {\r"
                  - "            return `${seconds} seconds`;\r"
                  - "        }\r"
                  - "        return \"\";\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Format timestamp to date string\r"
                  - "     * @param timestamp - Timestamp to format (defaults to now)\r"
                  - "     * @returns Formatted date string\r"
                  - "     */\r"
                  - "    static date(timestamp?: number): string {\r"
                  - "        let date = new Date();\r"
                  - "        if (timestamp) date = new Date(timestamp);\r"
                  - "        return dayjs(date).format(\"HH:mm:ss DD/MM/YYYY\");\r"
                  - "    }\r"
                  - "    /**\r"
                  - "     * Check if timestamp is in the past or now\r"
                  - "     * @param timestamp - Timestamp to check (defaults to now)\r"
                  - "     * @returns True if timestamp is in the past or now\r"
                  - "     */\r"
                  - "    static afterDate(timestamp?: number): boolean {\r"
                  - "        let date = new Date().getTime();\r"
                  - "        if (timestamp) date = new Date(timestamp).getTime();\r"
                  - "        return date <= new Date().getTime();\r"
                  - "    }\r"
                  - "}\r"
                  - ''
          - name: command
            type: folder
            children:
              - name: command
                type: ts
                code:
                  - "//-Path: \"cli/src/command/command.ts\"\r"
                  - "import \"./help\";\r"
                  - "import \"./init\";\r"
                  - "import \"./make\";\r"
                  - "import \"./render\";\r"
                  - "import \"./format\";\r"
                  - "import { program } from \"commander\";\r"
                  - "\r"
                  - "// Configure the CLI program\r"
                  - "program\r"
                  - "    .name(\"tcc\")\r"
                  - "    .description(\"CLI tool to create project structure from YAML configuration\")\r"
                  - "    .version(process.version);\r"
                  - "\r"
                  - "const args = process.argv;\r"
                  - "// check if there are any arguments\r"
                  - "if (args.length > 2) program.parse(args);\r"
