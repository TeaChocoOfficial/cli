                      - name: formatDirectory
                        type: ts
                        code:
                          - "// -Path: \"cli/src/command/function/format/formatDirectory.ts\"\r"
                          - "import * as path from \"path\";\r"
                          - "import * as fs from \"fs-extra\";\r"
                          - "import formatFile from \"./formatFile\";\r"
                          - "import { TccConfigJson } from \"../../types/config\";\r"
                          - "\r"
                          - "/**\r"
                          - " * Recursively format files in a directory\r"
                          - " */\r"
                          - "export default async function formatDirectory(\r"
                          - "    dirPath: string,\r"
                          - "    configJson: TccConfigJson,\r"
                          - "    exclude: string[] = [],\r"
                          - "): Promise<void> {\r"
                          - "    const files = await fs.readdir(dirPath);\r"
                          - "\r"
                          - "    for (const file of files) {\r"
                          - "        const filePath = path.join(dirPath, file);\r"
                          - "        const stat = await fs.stat(filePath);\r"
                          - "\r"
                          - "        if (stat.isDirectory())\r"
                          - "            await formatDirectory(filePath, configJson, exclude);\r"
                          - "        else if (stat.isFile()) {\r"
                          - "            const ext = path.extname(file);\r"
                          - "            const supportedExtensions = [\".ts\", \".tsx\", \".js\", \".jsx\", \".json\"];\r"
                          - "\r"
                          - "            if (supportedExtensions.includes(ext)) {\r"
                          - "                const isExcluded = exclude.some((excludePath) =>\r"
                          - "                    filePath.includes(excludePath),\r"
                          - "                );\r"
                          - "\r"
                          - "                if (!isExcluded) {\r"
                          - "                    const code = await fs.readFile(filePath, \"utf8\");\r"
                          - "                    const formatted = await formatFile(\r"
                          - "                        filePath,\r"
                          - "                        code,\r"
                          - "                        configJson,\r"
                          - "                    );\r"
                          - "\r"
                          - "                    if (formatted !== code) {\r"
                          - "                        await fs.writeFile(filePath, formatted, \"utf8\");\r"
                          - "                    }\r"
                          - "                }\r"
                          - "            }\r"
                          - "        }\r"
                          - "    }\r"
                          - "}\r"
                          - ''
                      - name: formatFile
                        type: ts
                        code:
                          - "// -Path: \"cli/src/command/function/format/formatFile.ts\"\r"
                          - "import chalk from \"chalk\";\r"
                          - "import formatLog from \"./formatLog\";\r"
                          - "import formatComment from \"./formatComment\";\r"
                          - "import formatPrettier from \"./formatPrettier\";\r"
                          - "import { TccConfigJson } from \"../../types/config\";\r"
                          - "\r"
                          - "export default async function formatFile(\r"
                          - "    filePath: string,\r"
                          - "    code: string,\r"
                          - "    tccConfigJson: TccConfigJson,\r"
                          - "): Promise<string> {\r"
                          - "    try {\r"
                          - "        const formatted = await formatPrettier(filePath, code, tccConfigJson);\r"
                          - "        const commented = formatComment(filePath, formatted, tccConfigJson);\r"
                          - "        const afterCode = commented;\r"
                          - "        formatLog(filePath, code, afterCode);\r"
                          - "\r"
                          - "        return afterCode;\r"
                          - "    } catch (error) {\r"
                          - "        if ((error as any).code === \"EBUSY\") {\r"
                          - "            console.error(chalk.yellow(`⚠️  File busy, skipping: ${filePath}`));\r"
                          - "        } else {\r"
                          - "            console.error(\r"
                          - "                chalk.red(`❌ Failed to format ${filePath}: ${error}`),\r"
                          - "            );\r"
                          - "        }\r"
                          - "        return code;\r"
                          - "    }\r"
                          - "}\r"
                          - ''
                      - name: formatLog
                        type: ts
                        code:
                          - "// -Path: \"cli/src/command/function/format/formatLog.ts\"\r"
                          - "import chalk from \"chalk\";\r"
                          - "import * as diff from \"diff\";\r"
                          - "\r"
                          - "export default function formatLog(\r"
                          - "    filePath: string,\r"
                          - "    code: string,\r"
                          - "    afterCode: string,\r"
                          - "): void {\r"
                          - "    if (afterCode !== code) {\r"
                          - "        const charDiff = afterCode.length - code.length;\r"
                          - "        const diffText = charDiff > 0 ? `+${charDiff}` : `${charDiff}`;\r"
                          - "        const diffColor = charDiff > 0 ? chalk.green : chalk.red;\r"
                          - "\r"
                          - "        console.log(chalk.cyan(`  📝 ${filePath}`));\r"
                          - "        console.log(chalk.gray(`     Before: ${code.length} chars`));\r"
                          - "        console.log(\r"
                          - "            chalk.gray(`     After:  ${afterCode.length} chars `) +\r"
                          - "                diffColor(`(${diffText})`),\r"
                          - "        );\r"
                          - "\r"
                          - "        const changes = diff.diffLines(code, afterCode);\r"
                          - "        changes.forEach((change: diff.Change) => {\r"
                          - "            if (change.added) {\r"
                          - "                console.log(chalk.green(`     + ${change.count} lines added`));\r"
                          - "            } else if (change.removed) {\r"
                          - "                console.log(chalk.red(`     - ${change.count} lines removed`));\r"
                          - "            }\r"
                          - "        });\r"
                          - "\r"
                          - "        console.log(\"\");\r"
                          - "    }\r"
                          - "}\r"
                          - ''
                      - name: formatPrettier
                        type: ts
                        code:
                          - "// -Path: \"cli/src/command/function/format/formatPrettier.ts\"\r"
                          - "import * as prettier from \"prettier\";\r"
                          - "import { TccConfigJson } from \"../../types/config\";\r"
                          - "\r"
                          - "export default async function formatPrettier(\r"
                          - "    filePath: string,\r"
                          - "    code: string,\r"
                          - "    tccConfigJson: TccConfigJson,\r"
                          - "): Promise<string> {\r"
                          - "    const prettierConfig = tccConfigJson.format?.prettier;\r"
                          - "\r"
                          - "    const defaultOptions: prettier.Options = {\r"
                          - "        semi: true,\r"
                          - "        tabWidth: 4,\r"
                          - "        useTabs: true,\r"
                          - "        endOfLine: \"lf\",\r"
                          - "        printWidth: 80,\r"
                          - "        quoteProps: \"as-needed\",\r"
                          - "        singleQuote: true,\r"
                          - "        arrowParens: \"always\",\r"
                          - "        trailingComma: \"all\",\r"
                          - "        bracketSpacing: true,\r"
                          - "        jsxSingleQuote: true,\r"
                          - "        bracketSameLine: false,\r"
                          - "        htmlWhitespaceSensitivity: \"strict\",\r"
                          - "    };\r"
                          - "    const options: prettier.Options = {\r"
                          - "        filepath: filePath,\r"
                          - "        semi: prettierConfig?.semicolon,\r"
                          - "        tabWidth: prettierConfig?.tabWidth,\r"
                          - "        useTabs: prettierConfig?.useTabs,\r"
                          - "        endOfLine: prettierConfig?.endOfLine,\r"
                          - "        printWidth: prettierConfig?.printWidth,\r"
                          - "        quoteProps: prettierConfig?.quoteProps,\r"
                          - "        singleQuote: prettierConfig?.singleQuote,\r"
                          - "        arrowParens: prettierConfig?.arrowParens,\r"
                          - "        trailingComma: prettierConfig?.trailingComma,\r"
                          - "        bracketSpacing: prettierConfig?.bracketSpacing,\r"
                          - "        jsxSingleQuote: prettierConfig?.jsxSingleQuote,\r"
                          - "        bracketSameLine: prettierConfig?.bracketSameLine,\r"
                          - "        htmlWhitespaceSensitivity: prettierConfig?.htmlSpace,\r"
                          - "    };\r"
                          - "    const prettierOptions = { ...defaultOptions, ...options };\r"
                          - "\r"
                          - "    const formatted = await prettier.format(code, prettierOptions);\r"
                          - "    return formatted;\r"
                          - "}\r"
                          - ''
                  - name: structure
                    type: folder
                    children:
                      - name: make
                        type: folder
                        children:
                          - name: file
                            type: ts
                            code:
                              - "// -Path: \"cli/src/command/function/structure/make/file.ts\"\r"
                              - "import path from 'path';\r"
                              - "import fs from 'fs-extra';\r"
                              - "\r"
                              - "export function getFileExtension(filename: string): string {\r"
                              - "    const ext = path.extname(filename).slice(1);\r"
                              - "    return ext || 'unknown';\r"
                              - "}\r"
                              - "\r"
                              - "export function getFileContent(filePath: string): string[] {\r"
                              - "    try {\r"
                              - "        const content = fs.readFileSync(filePath, 'utf8');\r"
                              - "        return content.split('\\n');\r"
                              - "    } catch {\r"
                              - "        return [];\r"
                              - "    }\r"
                              - "}\r"
                              - ''
                          - name: makeStructure
                            type: ts
                            code:
                              - >-
                                // -Path:
                                "cli/src/command/function/structure/makeStructure.ts"
                              - import chalk from 'chalk';
                              - import * as path from 'path';
                              - import * as fs from 'fs-extra';
                              - import * as yaml from 'js-yaml';
                              - import scanDirectory from './scanDirectory';
                              - >-
                                import { TccConfigJson } from
                                '../../../types/config';
                              - >-
                                import { StructureData, WorkSpace } from
                                '../../../types/structure';
                              - ''
                              - >-
                                export default async function
                                makeStructure(targetPath: string, tccConfig:
                                TccConfigJson) {
                              - '    try {'
                              - '        const { make } = tccConfig;'
                              - '        const output = make?.output;'
                              - '        if (!output || (!output.endsWith(''.yml'') && !output.endsWith(''.yaml'') && !output.endsWith(''.json'')))'
                              - '            throw new Error(''Output file must have .yaml, .yml, or .json extension'');'
                              - ''
                              - '        console.log(chalk.green(`🔍 Scanning directory: ${targetPath}`));'
                              - ''
                              - '        const src = await scanDirectory(targetPath);'
                              - ''
                              - '        const workspace: WorkSpace = {'
                              - '            name: make?.name || ''my-workspace'','
                              - '            run: make?.run || '''','
                              - '            pack: {},'
                              - '            src,'
                              - '        };'
                              - ''
                              - '        const structureData: StructureData = {'
                              - '            $schema:'
                              - '                ''https://raw.githubusercontent.com/TeaChocoOfficial/cli/main/structure.schema.json'','
                              - '            workspaces: [workspace],'
                              - '        };'
                              - ''
                              - '        const outputPath = path.join(process.cwd(), output);'
                              - '        const yamlContent = yaml.dump(structureData, { indent: 2 });'
                              - ''
                              - '        await fs.writeFile(outputPath, yamlContent);'
                              - ''
                              - '        console.log(chalk.green(`\n✅ Successfully generated ${output}`));'
                              - '        console.log(chalk.gray(`   Workspace name: ${workspace.name}`));'
                              - '        console.log(chalk.gray(`   Files scanned: ${src.length}`));'
                              - '    } catch (error) {'
                              - '        console.error('
                              - '            chalk.red(''Failed to generate structure:''),'
                              - '            error instanceof Error ? error.message : error,'
                              - '        );'
                              - '        process.exit(1);'
                              - '    }'
                              - '}'
                              - ''
                          - name: scanDirectory
                            type: ts
                            code:
                              - "// -Path: \"cli/src/command/function/structure/make/scanDirectory.ts\"\r"
                              - "import path from 'path';\r"
                              - "import fs from 'fs-extra';\r"
                              - "import { FileNode } from \"../../../types/file\";\r"
                              - "import { getFileExtension, getFileContent } from \"./file\";\r"
                              - "\r"
                              - "export default async function scanDirectory(\r"
                              - "    dirPath: string,\r"
                              - "    ignorePatterns: string[] = ['node_modules', '.git', 'dist', 'build'],\r"
                              - "): Promise<FileNode[]> {\r"
                              - "    const nodes: FileNode[] = [];\r"
                              - "    const entries = await fs.readdir(dirPath, { withFileTypes: true });\r"
                              - "\r"
                              - "    for (const entry of entries) {\r"
                              - "        if (ignorePatterns.includes(entry.name)) continue;\r"
                              - "\r"
                              - "        const fullPath = path.join(dirPath, entry.name);\r"
                              - "\r"
                              - "        if (entry.isDirectory()) {\r"
                              - "            const children = await scanDirectory(fullPath, ignorePatterns);\r"
                              - "            nodes.push({\r"
                              - "                name: entry.name,\r"
                              - "                type: 'folder',\r"
                              - "                children,\r"
                              - "            });\r"
                              - "        } else if (entry.isFile()) {\r"
                              - "            const ext = getFileExtension(entry.name);\r"
                              - "            if (['ts', 'tsx', 'png', 'jpg', 'jpeg', 'svg'].includes(ext)) {\r"
                              - "                nodes.push({\r"
                              - "                    name: path.parse(entry.name).name,\r"
                              - "                    type: ext,\r"
                              - "                    code:\r"
                              - "                        ext !== 'png' && ext !== 'jpg' && ext !== 'jpeg' && ext !== 'svg'\r"
                              - "                            ? getFileContent(fullPath)\r"
                              - "                            : [],\r"
                              - "                });\r"
                              - "            }\r"
                              - "        }\r"
                              - "    }\r"
                              - "\r"
                              - "    return nodes;\r"
                              - "}\r"
                              - ''
                      - name: render
                        type: folder
                        children:
                          - name: renderStructure
                            type: ts
                            code:
                              - "// -Path: \"cli/src/function/renderStructure.ts\"\r"
                              - "import chalk from 'chalk';\r"
                              - "import { RenderOptions } from '../../../render';\r"
                              - "import StructureConfig from './structureManager';\r"
                              - "import { TccConfigJson } from '../../../types/config';\r"
                              - "\r"
                              - "export default async function renderStructure(\r"
                              - "    targetPath: string,\r"
                              - "    configJson: TccConfigJson,\r"
                              - "    options: RenderOptions,\r"
                              - "): Promise<void> {\r"
                              - "    const structureConfig = new StructureConfig(configJson);\r"
                              - "    const isForce: boolean = options.force ?? configJson.render?.force ?? false;\r"
                              - "\r"
                              - "    try {\r"
                              - "        const data = await structureConfig.getData(targetPath);\r"
                              - "\r"
                              - "        const workspacesToRender = options.name\r"
                              - "            ? data.workspaces.filter((ws) => ws.name === options.name)\r"
                              - "            : data.workspaces;\r"
                              - "\r"
                              - "        if (workspacesToRender.length === 0) {\r"
                              - "            console.log(chalk.yellow(`No workspace found with name: ${options.name}`));\r"
                              - "            return;\r"
                              - "        }\r"
                              - "\r"
                              - "        for (const workspace of workspacesToRender) {\r"
                              - "            const src = await structureConfig.createRoot(workspace, isForce);\r"
                              - "\r"
                              - "            for (const node of src) {\r"
                              - "                const rootPath = structureConfig.getRootPath(workspace);\r"
                              - "                await structureConfig.createFiles(node, rootPath, isForce);\r"
                              - "            }\r"
                              - "        }\r"
                              - "\r"
                              - "        console.log(\r"
                              - "            chalk.green(\r"
                              - "                `\\n✅ Successfully created project structure at ${structureConfig.basePath}`,\r"
                              - "            ),\r"
                              - "        );\r"
                              - "    } catch (error) {\r"
                              - "        console.error(\r"
                              - "            'Failed to render structure:',\r"
                              - "            error instanceof Error ? error.message : error,\r"
                              - "        );\r"
                              - "        process.exit(1);\r"
                              - "    }\r"
                              - "}\r"
                              - ''
                          - name: StructureFile
                            type: ts
                            code:
                              - "// -Path: \"cli/src/command/function/structure/StructureFile.ts\"\r"
                              - "import chalk from 'chalk';\r"
                              - "import * as path from 'path';\r"
                              - "import * as fs from 'fs-extra';\r"
                              - "import { FileNode } from '../../../types/file';\r"
                              - "\r"
                              - "export default class StructureFile {\r"
                              - "    private node: FileNode;\r"
                              - "    private currentPath: string;\r"
                              - "    private force: boolean;\r"
                              - "\r"
                              - "    constructor(currentPath: string, node: FileNode, force: boolean = false) {\r"
                              - "        this.node = node;\r"
                              - "        this.currentPath = currentPath;\r"
                              - "        this.force = force;\r"
                              - "    }\r"
                              - "\r"
                              - "    async render(node?: FileNode, basePath?: string) {\r"
                              - "        const fileNode = node ?? this.node;\r"
                              - "        const currentPath = basePath ? path.join(basePath, fileNode.name) : this.currentPath;\r"
                              - "        console.log(chalk.gray(`\\n📁 Render ${currentPath}`));\r"
                              - "        if (fileNode.type === 'folder') {\r"
                              - "            await this.createFolder(currentPath, fileNode);\r"
                              - "        } else {\r"
                              - "            await this.createFile(fileNode, basePath ?? this.currentPath);\r"
                              - "        }\r"
                              - "    }\r"
                              - "\r"
                              - "    async createFolder(currentPath: string, node: FileNode) {\r"
                              - "        const exists = await fs.pathExists(currentPath);\r"
                              - "        if (exists && !this.force) {\r"
                              - "            console.log(chalk.gray(`📁 Skip folder ${currentPath} (already exists)`));\r"
                              - "        } else {\r"
                              - "            console.log(chalk.yellow(`📁 Create folder ${currentPath}`));\r"
                              - "            await fs.ensureDir(currentPath);\r"
                              - "        }\r"
                              - "        if (node.children) {\r"
                              - "            for (const child of node.children) {\r"
                              - "                await this.render(child, currentPath);\r"
                              - "            }\r"
                              - "        }\r"
                              - "    }\r"
                              - "\r"
                              - "    async createFile(child: FileNode, currentPath: string) {\r"
                              - "        const filePath = path.join(currentPath, child.name);\r"
                              - "        let content = '';\r"
                              - "        let ext = child.type;\r"
                              - "\r"
                              - "        if (child.code && child.code.length > 0) {\r"
                              - "            content = child.code.join('\\n');\r"
                              - "        }\r"
                              - "\r"
                              - "        const supportedTypes = ['folder', 'ts', 'tsx', 'png'];\r"
                              - "        if (!supportedTypes.includes(child.type)) {\r"
                              - "            throw new Error(`Unsupported file type: ${child.type}`);\r"
                              - "        }\r"
                              - "\r"
                              - "        switch (child.type) {\r"
                              - "            case 'ts':\r"
                              - "            case 'tsx':\r"
                              - "                ext = `.${child.type}`;\r"
                              - "                break;\r"
                              - "            case 'png':\r"
                              - "                ext = `.${child.type}`;\r"
                              - "                content = child.code?.[0] || '';\r"
                              - "                break;\r"
                              - "        }\r"
                              - "\r"
                              - "        const fileFullPath = `${filePath}${ext}`;\r"
                              - "        const exists = await fs.pathExists(fileFullPath);\r"
                              - "        if (exists && !this.force) {\r"
                              - "            console.log(chalk.redBright(`📄 Skip file ${fileFullPath} (already exists)`));\r"
                              - "            console.log(chalk.gray(`   Tip: Use -f or --force to overwrite`));\r"
                              - "        } else {\r"
                              - "            await fs.writeFile(fileFullPath, content);\r"
                              - "            console.log(chalk.cyan(`📄 Create file ${fileFullPath}`));\r"
                              - "        }\r"
                              - "    }\r"
                              - "}\r"
                              - ''
                          - name: structureManager
                            type: ts
                            code:
                              - "// -Path: \"cli/src/command/function/structure/structureConfig.ts\"\r"
                              - "import chalk from 'chalk';\r"
                              - "import * as path from 'path';\r"
                              - "import * as fs from 'fs-extra';\r"
                              - "import * as yaml from 'js-yaml';\r"
                              - "import { FileNode } from '../../../types/file';\r"
                              - "import StructureFile from './StructureFile';\r"
                              - "import { TccConfigJson } from '../../../types/config';\r"
                              - "import { StructureData, WorkSpace } from '../../../types/structure';\r"
                              - "\r"
                              - "export default class StructureManager {\r"
                              - "    public basePath: string = '.';\r"
                              - "    private configJson: TccConfigJson;\r"
                              - "    private structureData: StructureData | null = null;\r"
                              - "\r"
                              - "    constructor(configJson: TccConfigJson) {\r"
                              - "        this.configJson = configJson;\r"
                              - "    }\r"
                              - "\r"
                              - "    getPath(targetPath: string): string {\r"
                              - "        const { render } = this.configJson;\r"
                              - "        const structurePath: string[] = render?.structurePath\r"
                              - "            ? [render?.structurePath]\r"
                              - "            : [targetPath, 'teachoco-dev.yaml'];\r"
                              - "        this.basePath = this.configJson.render?.basePath ?? targetPath;\r"
                              - "        const teachocoDevPath = path.join(process.cwd(), ...structurePath);\r"
                              - "        return teachocoDevPath;\r"
                              - "    }\r"
                              - "\r"
                              - "    async getData(structurePath: string): Promise<StructureData> {\r"
                              - "        const teachocoDevPath = this.getPath(structurePath);\r"
                              - "        const structureContent = await fs.readFile(teachocoDevPath, 'utf8');\r"
                              - "        console.log(chalk.green(`🦴 Reading structure from ${teachocoDevPath}`));\r"
                              - "        if (teachocoDevPath.endsWith('.yaml') || teachocoDevPath.endsWith('.yml'))\r"
                              - "            return this.setData(yaml.load(structureContent) as StructureData);\r"
                              - "        else if (teachocoDevPath.endsWith('.json'))\r"
                              - "            return this.setData(JSON.parse(structureContent) as StructureData);\r"
                              - "        throw new Error('Structure file must be a YAML or JSON file');\r"
                              - "    }\r"
                              - "\r"
                              - "    setData(data: StructureData) {\r"
                              - "        this.structureData = data;\r"
                              - "        return this.structureData;\r"
                              - "    }\r"
                              - "\r"
                              - "    getRootPath(workspace: WorkSpace): string {\r"
                              - "        return path.join(process.cwd(), this.basePath, workspace.name);\r"
                              - "    }\r"
                              - "\r"
                              - "    async createRoot(workspace: WorkSpace, force?: boolean): Promise<FileNode[]> {\r"
                              - "        if (!workspace) throw new Error('Workspace data not found');\r"
                              - "        if (!workspace.name || !workspace.src)\r"
                              - "            throw new Error(\"Invalid workspace data: 'name' and 'src' are required\");\r"
                              - "\r"
                              - "        const rootPath = this.getRootPath(workspace);\r"
                              - "        console.log(chalk.green(`📁 Creating root directory: ${rootPath}`));\r"
                              - "\r"
                              - "        await fs.ensureDir(rootPath);\r"
                              - "\r"
                              - "        if (force) await fs.emptyDir(rootPath);\r"
                              - "\r"
                              - "        return workspace.src;\r"
                              - "    }\r"
                              - "\r"
                              - "    /**\r"
                              - "     * Create files and folders from a FileNode\r"
                              - "     * @param node The file or folder node to create\r"
                              - "     * @param basePath The base path to create the node in (defaults to this.basePath)\r"
                              - "     */\r"
                              - "    async createFiles(node: FileNode, basePath: string, force: boolean = false): Promise<void> {\r"
                              - "        const currentPath = path.join(basePath, node.name);\r"
                              - "        const structureFile = new StructureFile(currentPath, node, force);\r"
                              - "        await structureFile.render();\r"
                              - "\r"
                              - "        // if (node.type === 'folder') {\r"
                              - "        //     await fs.ensureDir(currentPath);\r"
                              - "        //     if (node.children) {\r"
                              - "        //         for (const child of node.children) {\r"
                              - "        //             await this.createFile(child, currentPath);\r"
                              - "        //         }\r"
                              - "        //     }\r"
                              - "        // } else {\r"
                              - "        //     let content = '';\r"
                              - "        //     let ext = node.type;\r"
                              - "\r"
                              - "        //     if (node.code && node.code.length > 0) {\r"
                              - "        //         content = node.code.join('\\n');\r"
                              - "        //     }\r"
                              - "\r"
                              - "        //     const supportedTypes = ['folder', 'ts', 'tsx', 'png'];\r"
                              - "        //     if (!supportedTypes.includes(node.type)) {\r"
                              - "        //         throw new Error(`Unsupported file type: ${node.type}`);\r"
                              - "        //     }\r"
                              - "\r"
                              - "        //     switch (node.type) {\r"
                              - "        //         case 'ts':\r"
                              - "        //         case 'tsx':\r"
                              - "        //             ext = `.${node.type}`;\r"
                              - "        //             break;\r"
                              - "        //         case 'png':\r"
                              - "        //             content = node.code?.[0] || '';\r"
                              - "        //             // TODO: เพิ่มการจัดการไฟล์ภาพ เช่น แปลง base64 หรือคัดลอกไฟล์\r"
                              - "        //             break;\r"
                              - "        //     }\r"
                              - "\r"
                              - "        //     await fs.writeFile(`${currentPath}${ext}`, content);\r"
                              - "        // }\r"
                              - "    }\r"
                              - "}\r"
                              - ''
              - name: help
                type: ts
                code:
                  - "//-Path: \"cli/src/command/help.ts\"\r"
                  - "import { program } from \"commander\";\r"
                  - "\r"
                  - "// Show help when no arguments are provided or when using -h\r"
                  - "program.on(\"--help\", () => {\r"
                  - "    console.log(\"\");\r"
                  - "    console.log(\"Examples:\");\r"
