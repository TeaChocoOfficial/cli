              - name: init
                type: ts
                code:
                  - '// -Path: "cli/src/command/init.ts"'
                  - import chalk from 'chalk';
                  - import * as path from 'path';
                  - import * as fs from 'fs-extra';
                  - import { program } from 'commander';
                  - import { TccConfigJson } from './types/config';
                  - ''
                  - program
                  - '    .command(''init'')'
                  - '    .argument(''[path]'', ''path to create config file'')'
                  - '    .description(''Create a default tcc.config.json in the current directory'')'
                  - '    .option(''-f, --force'', ''overwrite existing config file'')'
                  - '    .action(async (targetPath?: string, options: { force?: boolean } = {}) => {'
                  - '        const configPath = path.resolve(process.cwd(), targetPath || ''.'', ''tcc.config.json'');'
                  - ''
                  - '        if (await fs.pathExists(configPath)) {'
                  - '            console.log(chalk.yellow(`⚠ tcc.config.json already exists at ${configPath}`));'
                  - '            if (!options.force) {'
                  - '                console.log(chalk.yellow(''Use --force to overwrite''));'
                  - '                return;'
                  - '            }'
                  - '            console.log(chalk.yellow(''Overwriting existing config file...''));'
                  - '        }'
                  - ''
                  - '        const defaultConfig: TccConfigJson = {'
                  - '            $schema:'
                  - '                ''https://raw.githubusercontent.com/TeaChocoOfficial/cli/main/tcc.config.schema.json'','
                  - '            format: {'
                  - '                commentPath: true,'
                  - '                prettier: {'
                  - '                    semicolon: true,'
                  - '                    singleQuote: false,'
                  - '                    tabWidth: 4,'
                  - '                    trailingComma: ''all'','
                  - '                    printWidth: 80,'
                  - '                },'
                  - '            },'
                  - '            render: {'
                  - '                force: true,'
                  - '            },'
                  - '            exclude: [''node_modules'', ''dist'', ''.git''],'
                  - '        };'
                  - ''
                  - '        await fs.writeJson(configPath, defaultConfig, { spaces: 2 });'
                  - '        console.log(chalk.green(`✅ Created tcc.config.json at ${configPath}`));'
                  - '    });'
                  - ''
              - name: make
                type: ts
                code:
                  - '// -Path: "cli/src/command/make.ts"'
                  - import * as path from 'path';
                  - import { program } from 'commander';
                  - import getConfig from './function/config/getConfig';
                  - >-
                    import makeStructure from
                    './function/structure/make/makeStructure';
                  - ''
                  - program
                  - '    .command(''make'')'
                  - '    .argument(''[path]'', ''path to scan for folder structure (default: current directory)'', ''.'')'
                  - '    .option(''-w, --watch'', ''watch for changes and update the output file'')'
                  - '    .option(''-o, --output <file>'', ''output YAML or JSON file name'', ''teachoco-dev.yaml'')'
                  - '    .option(''-n, --name <name>'', ''workspace name'', ''my-workspace'')'
                  - '    .option(''-r, --run <command>'', ''run command'', ''npm start'')'
                  - '    .description(''Generate teachoco-dev.yaml from existing folder structure'')'
                  - '    .action('
                  - '        async ('
                  - '            targetPath: string,'
                  - '            options: { output?: string; name?: string; run?: string; watch?: boolean },'
                  - '        ) => {'
                  - '            const fullPath = path.resolve(process.cwd(), targetPath);'
                  - '            const configJson = await getConfig(targetPath, {'
                  - '                make: {'
                  - '                    watch: options.watch,'
                  - '                    output: options.output,'
                  - '                    name: options.name,'
                  - '                    run: options.run,'
                  - '                },'
                  - '            });'
                  - '            await makeStructure(fullPath, configJson);'
                  - '        },'
                  - '    );'
                  - ''
              - name: render
                type: ts
                code:
                  - "// -Path: \"cli/src/command/render.ts\"\r"
                  - "import * as path from 'path';\r"
                  - "import chokidar from 'chokidar';\r"
                  - "import { program } from 'commander';\r"
                  - "import getConfig from './function/config/getConfig';\r"
                  - "import renderStructure from './function/structure/render/renderStructure';\r"
                  - "\r"
                  - "export type RenderOptions = {\r"
                  - "    watch?: boolean;\r"
                  - "    name?: string;\r"
                  - "    force?: boolean;\r"
                  - "};\r"
                  - "\r"
                  - "// Configure the 'render' command\r"
                  - "program\r"
                  - "    .command('render')\r"
                  - "    .argument('<path>', 'path to YAML file (e.g., ./path/to/projects)')\r"
                  - "    .description('Render folder structure from YAML file')\r"
                  - "    .option('-w, --watch', 'watch for changes in the YAML file and re-render')\r"
                  - "    .option('-f, --force', 'force re-render even if no changes detected')\r"
                  - "    .option('-n, --name <name>', 'render specific workspace by name')\r"
                  - "    .action(async (targetPath: string, options: RenderOptions) => {\r"
                  - "        const fullPath = path.resolve(process.cwd(), targetPath);\r"
                  - "        const configJson = await getConfig(targetPath, {\r"
                  - "            render: { watch: options.watch },\r"
                  - "        });\r"
                  - "        // Run once\r"
                  - "        await renderStructure(targetPath, configJson, options);\r"
                  - "\r"
                  - "        // If --watch option is provided\r"
                  - "        if (options.watch) {\r"
                  - "            console.log(`Watching for changes in ${fullPath}...`);\r"
                  - "            const yamlFilePath = path.resolve(process.cwd(), fullPath);\r"
                  - "\r"
                  - "            // Use chokidar to detect changes\r"
                  - "            const watcher = chokidar.watch(yamlFilePath, {\r"
                  - "                persistent: true,\r"
                  - "                ignoreInitial: false,\r"
                  - "            });\r"
                  - "\r"
                  - "            watcher.on('change', async (filePath) => {\r"
                  - "                console.log(`File ${filePath} changed, re-rendering...`);\r"
                  - "                await renderStructure(fullPath, configJson, options);\r"
                  - "            });\r"
                  - "\r"
                  - "            // Handle watcher errors\r"
                  - "            watcher.on('error', (error) => {\r"
                  - "                console.error('Watcher error:', error);\r"
                  - "            });\r"
                  - "        }\r"
                  - "    });\r"
                  - ''
              - name: types
                type: folder
                children:
                  - name: config
                    type: ts
                    code:
                      - "// -Path: \"cli/src/command/types/config.ts\"\r"
                      - "import { MakeConfig } from './make';\r"
