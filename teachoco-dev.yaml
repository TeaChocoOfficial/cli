              - name: format
                type: ts
                code:
                  - "// -Path: \"cli/src/command/format.ts\"\r"
                  - "import chalk from 'chalk';\r"
                  - "import * as path from 'path';\r"
                  - "import * as fs from 'fs-extra';\r"
                  - "import chokidar from 'chokidar';\r"
                  - "import { program } from 'commander';\r"
                  - "import getConfig from './function/config/getConfig';\r"
                  - "import formatFile from './function/format/formatFile';\r"
                  - "import formatDirectory from './function/format/formatDirectory';\r"
                  - "\r"
                  - "program\r"
                  - "    .command('format')\r"
                  - "    .argument('<path>', 'path to format')\r"
                  - "    .description('Format code (use -w or --watch for watch mode)')\r"
                  - "    .option('-w, --watch', 'watch for changes')\r"
                  - "    .action(async (targetPath: string, options: { watch?: boolean }) => {\r"
                  - "        const fullPath = path.resolve(process.cwd(), targetPath);\r"
                  - "        const configJson = await getConfig(fullPath, {\r"
                  - "            format: { watch: options.watch },\r"
                  - "        });\r"
                  - "\r"
                  - "        if (configJson.format?.watch) {\r"
                  - "            await formatDirectory(fullPath, configJson, configJson.exclude);\r"
                  - "\r"
                  - "            console.log(chalk.blue.bold(`👀 Watching for changes in ${fullPath}\\\\...`));\r"
                  - "            const watcher = chokidar.watch(fullPath, {\r"
                  - "                persistent: true,\r"
                  - "                ignoreInitial: false,\r"
                  - "            });\r"
                  - "\r"
                  - "            watcher.on('change', async (filePath) => {\r"
                  - "                const ext = path.extname(filePath);\r"
                  - "                const supportedExtensions = ['.ts', '.tsx', '.js', '.jsx', '.json'];\r"
                  - "\r"
                  - "                const isExcluded = configJson.exclude?.some((excludePath) =>\r"
                  - "                    filePath.includes(excludePath),\r"
                  - "                );\r"
                  - "\r"
                  - "                if (supportedExtensions.includes(ext) && !isExcluded) {\r"
                  - "                    const code = await fs.readFile(filePath, 'utf8');\r"
                  - "                    const formatted = await formatFile(filePath, code, configJson);\r"
                  - "\r"
                  - "                    if (formatted !== code) {\r"
                  - "                        await fs.writeFile(filePath, formatted, 'utf8');\r"
                  - "                        console.log(chalk.green(`✅ Formatted: ${filePath}`));\r"
                  - "                    }\r"
                  - "                }\r"
                  - "            });\r"
                  - "\r"
                  - "            watcher.on('error', (error) => {\r"
                  - "                console.error(chalk.red(`❌ Watcher error: ${error}`));\r"
                  - "            });\r"
                  - "        } else {\r"
                  - "            console.log(chalk.blue.bold(`🔨 Formatting code in ${fullPath}\\\\...`));\r"
                  - "            await formatDirectory(fullPath, configJson, configJson.exclude);\r"
                  - "            console.log(chalk.green.bold(`✅ Done formatting code in ${fullPath}\\\\`));\r"
                  - "        }\r"
                  - "    });\r"
                  - ''
              - name: function
                type: folder
                children:
                  - name: config
                    type: folder
                    children:
                      - name: findConfigJson
                        type: ts
                        code:
                          - "// -Path: \"cli/src/command/function/config/findConfigJson.ts\"\r"
                          - "import chalk from \"chalk\";\r"
                          - "import * as path from \"path\";\r"
                          - "import * as fs from \"fs-extra\";\r"
                          - "import { TccConfigJson } from \"../../types/config\";\r"
                          - "\r"
                          - "export default async function findConfigJson(\r"
                          - "    rootPath: string,\r"
                          - "): Promise<TccConfigJson> {\r"
                          - "    const configFileName = \"tcc.config.json\";\r"
                          - "    let currentPath = path.resolve(process.cwd(), rootPath);\r"
                          - "\r"
                          - "    while (currentPath !== path.parse(currentPath).root) {\r"
                          - "        const configPath = path.join(currentPath, configFileName);\r"
                          - "\r"
                          - "        if (await fs.pathExists(configPath)) {\r"
                          - "            try {\r"
                          - "                const configContent = await fs.readFile(configPath, \"utf8\");\r"
                          - "                const config = JSON.parse(configContent) as TccConfigJson;\r"
                          - "                console.log(chalk.blue(`📄 Found tcc.config.json at ${configPath}\\n`));\r"
                          - "                return config;\r"
                          - "            } catch (error) {\r"
                          - "                throw new Error(\r"
                          - "                    `Failed to parse ${configPath}: ${error instanceof Error ? error.message : String(error)}`,\r"
                          - "                );\r"
                          - "            }\r"
                          - "        }\r"
                          - "\r"
                          - "        currentPath = path.dirname(currentPath);\r"
                          - "    }\r"
                          - "\r"
                          - "    throw new Error(\"No tcc.config.json found\");\r"
                          - "}\r"
                          - ''
                      - name: getConfig
                        type: ts
                        code:
                          - "// -Path: \"cli/src/command/function/config/getConfig.ts\"\r"
                          - "import { Obj } from \"../../../class/obj\";\r"
                          - "import findConfigJson from \"./findConfigJson\";\r"
                          - "import { TccConfigJson } from \"../../types/config\";\r"
                          - "\r"
                          - "export default async function getConfig(\r"
                          - "    targetPath: string,\r"
                          - "    defaultConfig: TccConfigJson,\r"
                          - "): Promise<TccConfigJson> {\r"
                          - "    try {\r"
                          - "        const configJson = await findConfigJson(targetPath);\r"
                          - "        return Obj.mix(defaultConfig, configJson);\r"
                          - "    } catch (_err) {\r"
                          - "        return defaultConfig;\r"
                          - "    }\r"
                          - "}\r"
                          - ''
                  - name: format
                    type: folder
