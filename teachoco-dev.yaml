                      - "    /**\r"
                      - "     * @description Child nodes for folders\r"
                      - "     */\r"
                      - "    children?: FileNode[];\r"
                      - "}\r"
                      - ''
                  - name: format
                    type: ts
                    code:
                      - "// -Path: \"cli/src/command/types/format.ts\"\r"
                      - "import { PrettierConfig } from \"./prettier\";\r"
                      - "\r"
                      - "export interface FormatConfig {\r"
                      - "    /**\r"
                      - "     * @description Watch for changes\r"
                      - "     * @default false\r"
                      - "     */\r"
                      - "    watch?: boolean;\r"
                      - "\r"
                      - "    /**\r"
                      - "     * @description Comment path in file\r"
                      - "     * @default true\r"
                      - "     * @param {boolean} true - comment path\r"
                      - "     * @param {boolean} false - don't comment path\r"
                      - "     * @param {string} string - comment path with custom text (e.g. \" - Path: 'path'\")\r"
                      - "     */\r"
                      - "    commentPath?: boolean | string;\r"
                      - "\r"
                      - "    /**\r"
                      - "     * @description Prettier configuration\r"
                      - "     */\r"
                      - "    prettier?: PrettierConfig;\r"
                      - "}\r"
                      - ''
                  - name: make
                    type: ts
                    code:
                      - "// -Path: \"cli/src/command/types/make.ts\"\r"
                      - "\r"
                      - "export interface MakeConfig {\r"
                      - "    /**\r"
                      - "     * @description Watch for changes and update the output file\r"
                      - "     * @default false\r"
                      - "     */\r"
                      - "    watch?: boolean;\r"
                      - "\r"
                      - "    /**\r"
                      - "     * @description Output file name\r"
                      - "     */\r"
                      - "    output?: string;\r"
                      - "\r"
                      - "    /**\r"
                      - "     * @description Workspace name\r"
                      - "     */\r"
                      - "    name?: string;\r"
                      - "\r"
                      - "    /**\r"
                      - "     * @description Run command\r"
                      - "     */\r"
                      - "    run?: string;\r"
                      - "}\r"
                      - ''
                  - name: prettier
                    type: ts
                    code:
                      - "// -Path: \"cli/src/command/types/prettier.ts\"\r"
                      - "\r"
                      - "export interface PrettierConfig {\r"
                      - "    /**\r"
                      - "     * @description Add semicolon at the end of line\r"
                      - "     * @default true\r"
                      - "     */\r"
                      - "    semicolon?: boolean;\r"
                      - "\r"
                      - "    /**\r"
                      - "     * @description Tab width\r"
                      - "     * @default 4\r"
                      - "     */\r"
                      - "    tabWidth?: number;\r"
                      - "\r"
                      - "    /**\r"
                      - "     * @description Use tabs instead of spaces\r"
                      - "     * @default true\r"
                      - "     */\r"
